<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ADMINISTRATION CONSOLE</title>
<style>
body, html {
    margin: 0; padding: 0; overflow: hidden; height: 100%;
    background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
#launcher-ui {
    width: 100%; height: 100%; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background: radial-gradient(circle, #001f3f 0%, #000000 100%);
}
/* Loading Animation: Blue and Green Spinning Circles */
.loader {
    width: 100px; height: 100px; border: 10px solid #00ff88;
    border-top: 10px solid #0077ff; border-radius: 50%;
    animation: spin 1s linear infinite; margin-bottom: 20px;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
.status-text {
    color: #00ff88; font-size: 20px; text-shadow: 0 0 10px #00ff88;
    margin-bottom: 20px;
}
.btn {
    padding: 15px 30px; background: transparent; color: #fff;
    border: 2px solid #0077ff; border-radius: 5px; cursor: pointer;
    font-size: 16px; transition: 0.3s; margin: 10px;
}
.btn:hover { background: #0077ff; box-shadow: 0 0 20px #0077ff; }
.slow-btn { color: #ffcc00; border-color: #ffcc00; display: none; }
#console-output {
    display: none; width: 100%; height: 100%; background: #000;
    color: #00ff88; padding: 20px; box-sizing: border-box; overflow-y: auto;
    white-space: pre-wrap; font-family: monospace; font-size: 14px;
}
</style>
</head>
<body>

<div id="launcher-ui">
    <div class="loader" id="loader-circle"></div>
    <div class="status-text" id="status">INITIALIZING CONSOLE PLEASE WAIT...</div>
    <button class="btn" id="main-btn" onclick="loadConsoleFile()">OPEN ADMINISTRATIVE SERVER & DATA CONSOLE</button>
    <button class="btn slow-btn" id="slow-btn" onclick="loadConsoleFile()">TAKING TOO LONG? FORCE LOAD</button>
    <button class="btn" onclick="openUndetectable()">OPEN ADMINISTRATIVE CONSOLE</button>
</div>

<!-- Replaced iframe with a preformatted text box for the XML file -->
<div id="console-output"></div>

<script>
const FILE_URL = '';

async function loadConsoleFile() {
    const status = document.getElementById('status');
    const mainBtn = document.getElementById('main-btn');
    const slowBtn = document.getElementById('slow-btn');
    
    mainBtn.style.display = 'none';
    status.innerText = "CONNECTING TO SERVER DATA CONSOLE...";
    
    // Show "Force Load" button after 5 seconds
    setTimeout(() => {
        slowBtn.style.display = 'block';
    }, 5000);

    try {
        const response = await fetch(FILE_URL);
        const data = await response.text();
        displayData(data);
    } catch (error) {
        status.innerText = "COULD NOT CONNECT. LAUNCHING BACKUP SERVER... CONSOLE OPERATIONAL...";
        // Fallback: If local file fails, display the error in the console box
        displayData("Error: Could not read local file. \nDetails: " + error.message);
    }
}

function displayData(fileText) {
    // Hide the launcher UI and show the data console box
    document.getElementById('launcher-ui').style.display = 'none';
    const consoleBox = document.getElementById('console-output');
    consoleBox.style.display = 'block';
    
    // Display the XML file contents securely as plain text
    consoleBox.innerText = fileText;
}

function openUndetectable() {
    const adminConsoleURL = 'https://cdn.jsdelivr.net/gh/Silentminer9217/Idk.html@main/consoleadmin.html';
    window.open(adminConsoleURL, "_blank");
}
</script>

</body>
</html>
